<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WProute - Visor de Rutas Aeronáuticas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-title {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 8px;
        }
        h1 {
            color: #38BDF8;
            margin: 0;
            font-size: 2.2rem;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #fff;
            margin: 0 auto 2rem auto;
            display: block;
        }
        .routes-container {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            gap: 1.5rem;
        }
        .route-card {
            background-color: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .route-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #38BDF8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .route-item {
            background-color: #0F172A;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .route-item:last-child {
            margin-bottom: 0;
        }
        .route-details {
            font-size: 0.95rem;
            color: #CBD5E1;
            margin-top: 6px;
        }
        .badge {
            background: #334155;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #38BDF8;
        }
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-title">
            <img src="./iconwp.png" alt="WProute Logo" class="logo-img">
            <h1>WProute</h1>
        </div>
        <p style="margin-top: 8px; color: #94A3B8;">Visor de Rutas Aeronáuticas (PWA)</p>
    </header>

    <main>
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar por ADES (ej. MMMY, MMCL)...">
        <div id="routesList" class="routes-container">Cargando rutas aeronáuticas...</div>
    </main>

    <script>
        let rutasData = [];

        // Cargar el archivo rutas.json
        fetch('./rutas.json')
            .then(response => response.json())
            .then(data => {
                rutasData = data;
                renderRoutes(rutasData);
            })
            .catch(error => {
                console.error('Error cargando rutas.json:', error);
                document.getElementById('routesList').innerHTML = '<p style="text-align:center; color: #EF4444;">Error al cargar los datos de rutas.</p>';
            });

        function renderRoutes(routes) {
            const container = document.getElementById('routesList');
            if (routes.length === 0) {
                container.innerHTML = '<p style="text-align:center;">No se encontraron rutas.</p>';
                return;
            }

            // Agrupar rutas estrictamente por ADES normalizado
            const grouped = {};
            routes.forEach(r => {
                const adesKey = r.ades.trim().toUpperCase();
                if (!grouped[adesKey]) {
                    grouped[adesKey] = {
                        categoria: r.categoria,
                        items: []
                    };
                }
                grouped[adesKey].items.push(r);
            });

            // Generar HTML agrupado en una sola tarjeta por ADES
            container.innerHTML = Object.keys(grouped).map(ades => {
                const group = grouped[ades];
                const itemsHtml = group.items.map(r => `
                    <div class="route-item">
                        <div class="sub-header">
                            <span class="badge">${r.type}</span>
                            <span style="font-size: 0.85rem; color: #94A3B8;">RFL: ${r.rfl}</span>
                        </div>
                        <div class="route-details">
                            <p style="margin: 0;"><strong>Ruta:</strong> ${r.route}</p>
                        </div>
                    </div>
                `).join('');

                return `
                    <div class="route-card">
                        <div class="route-header">
                            <span>ADES: ${ades}</span>
                            <span style="font-size: 0.85rem; color: #94A3B8; font-weight: normal;">Categoría: ${group.categoria}</span>
                        </div>
                        ${itemsHtml}
                    </div>
                `;
            }).join('');
        }

        // Filtrado dinámico
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query === '') {
                renderRoutes(rutasData);
                return;
            }
            const filtered = rutasData.filter(r => 
                r.ades.toLowerCase().includes(query) || 
                r.type.toLowerCase().includes(query) ||
                r.route.toLowerCase().includes(query) ||
                r.categoria.toLowerCase().includes(query)
            );
            renderRoutes(filtered);
        });

        // Registrar el Service Worker y forzar actualización
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('Service Worker registrado:', reg.scope);
                        reg.update();
                    })
                    .catch(err => console.log('Error en Service Worker:', err));
            });
        }
    </script>
</body>
</html>
